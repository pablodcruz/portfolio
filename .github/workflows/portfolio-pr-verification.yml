name: Portfolio PR verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    name: Pages and Worker
    if: github.repository == 'pablodcruz/portfolio' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out exact prospective merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm merge revision and both parents
        env:
          EXPECTED_MERGE: ${{ github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          printf 'merge=%s base=%s head=%s tree=%s\n' "$EXPECTED_MERGE" "$EXPECTED_BASE" "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')"
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and check types
        run: |
          npm run lint
          npm exec --no -- tsc --noEmit
      - name: Build static Pages output
        run: npm run build:pages
      - name: Verify exported link and asset under /portfolio/
        run: python3 -B .github/scripts/verify-portfolio-export.py out
      - name: Install pinned browser test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/portfolio-browser"
          "$RUNNER_TEMP/portfolio-browser/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/portfolio-browser/bin/python" -m playwright install chromium
      - name: Check the illustrated export in Chromium
        run: |
          "$RUNNER_TEMP/portfolio-browser/bin/python" -B .github/scripts/verify-portfolio-browser.py out
      - name: Build and test the Vinext Worker
        run: env -u GITHUB_PAGES npm test
